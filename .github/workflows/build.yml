name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub 저장소 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2 설치
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: ZIP 파일 찾기
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "찾은 ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: 프로젝트 압축 풀기
        run: |
          rm -rf project
          mkdir project
          unzip -o "$ZIP_FILE" -d project

      - name: 프로젝트 구조 확인
        run: |
          echo "===== 프로젝트 구조 ====="
          find project -maxdepth 4 -type f | sort

      - name: APK 빌드
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: JaRoleplay-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
